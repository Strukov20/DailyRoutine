appId: com.familyflow.app
name: Family task workflow
# User A creates an unassigned shared task -> signs out -> User B takes
# it (self-claim, immediate acceptance) -> completes it -> confirm state.
# Uses the "User A"/"User B" fixtures from scripts/e2e-seed.sh
# (npm run e2e:seed, same family) — run that (after a fresh
# `npm run db:reset`) before this flow.
#
# See personal_task_smoke.yaml's header for the full writeup of the
# environment issues every flow in this directory works around (password
# text-injection on tapOn-right-after-typing, Maestro's plain text
# selectors not reliably matching certain accessibility-merged elements,
# and significant tap-delivery flakiness - observed ~2-in-10 on ordinary
# elements, effectively deterministic at the tab bar's screen-edge items -
# that every mutating or navigating tap below defends against with a
# single bounded conditional retry, never a blind repeat) and
# docs/DECISIONS.md, "Phase 5" for the complete investigation and the
# honest reliability numbers.
---
- launchApp:
    clearState: true
- tapOn: 'Continue'

# --- Sign in as User A ---
- tapOn:
    id: 'sign-in-email'
- inputText: 'maestro-user-a@familyflow.test'
- tapOn:
    id: 'sign-in-password'
- tapOn: 'Show password'
- extendedWaitUntil:
    visible:
      id: 'sign-in-password'
    timeout: 15000
- repeat:
    while:
      notVisible: '^Maestro1234$'
    commands:
      - tapOn:
          id: 'sign-in-password'
      - eraseText: 50
      - inputText: 'Maestro1234'
      - waitForAnimationToEnd
- tapOn:
    id: 'sign-in-password'
- pressKey: Enter
- extendedWaitUntil:
    visible: 'Not Now'
    timeout: 10000
    optional: true
- tapOn:
    text: 'Not Now'
    optional: true
- extendedWaitUntil:
    visible: 'Today'
    timeout: 10000

# --- User A creates an unassigned shared task ---
# Navigation tap - occasionally silent-no-ops (see header); retry once,
# bounded, only if the destination hasn't loaded. Tapping a tab twice is
# harmless.
- waitForAnimationToEnd
- tapOn:
    id: 'tab-family'
- extendedWaitUntil:
    visible: 'Tasks'
    timeout: 5000
    optional: true
- runFlow:
    when:
      notVisible: 'Tasks'
    commands:
      - tapOn:
          id: 'tab-family'
      - extendedWaitUntil:
          visible: 'Tasks'
          timeout: 10000
- tapOn: 'Tasks'
- extendedWaitUntil:
    visible:
      id: 'family-task-board-fab'
    timeout: 8000
- tapOn:
    id: 'family-task-board-fab'
- extendedWaitUntil:
    visible:
      id: 'task-editor-title'
    timeout: 8000
- tapOn:
    id: 'task-editor-title'
- inputText: 'Maestro Family Task'
# Tapping submit directly after typing was confirmed (repeatedly, across
# both this field and the sign-in password field) to inject one stray
# character into whatever field still held focus - see
# personal_task_smoke.yaml's header. Tapping a neutral, non-interactive
# label first gives that phantom keystroke somewhere harmless to land.
- tapOn: 'Priority'
- waitForAnimationToEnd
- tapOn:
    id: 'task-editor-submit'
# A mis-landed tap can occasionally trigger the form's own unsaved-changes
# guard (`beforeRemove` in TaskEditorForm) even on an otherwise-successful
# submit - confirmed via code review that this is a spurious/stale
# artifact, NOT a real double-submission risk from the tap itself (the
# submit button has a solid react-hook-form `isSubmitting` disabled
# guard). The real risk is in THIS recovery logic: by the time a retry
# tap fires, the first submission has already completed and the button is
# re-enabled, so blindly retrying submits the same still-filled form a
# second time and creates a genuine duplicate task (reproduced once in
# this session - see docs/DECISIONS.md, "Phase 5"). Fix: check for
# success first and only attempt the discard/retry recovery if the first
# submit did NOT actually go through - this is the general pattern every
# mutation in this flow follows: prove non-success before ever retrying.
- extendedWaitUntil:
    visible:
      id: 'family-task-row-.*'
    timeout: 5000
    optional: true
- runFlow:
    when:
      notVisible:
        id: 'family-task-row-.*'
    commands:
      - extendedWaitUntil:
          visible: 'Discard changes?'
          timeout: 3000
          optional: true
      - tapOn:
          text: 'Cancel'
          optional: true
      - tapOn:
          id: 'task-editor-submit'
          optional: true
- extendedWaitUntil:
    visible:
      id: 'family-task-row-.*'
    timeout: 15000

# --- User A signs out ---
# assertVisible("Profile") and tapOn("Profile") both fail deterministically
# here, and so does tapOn: { id: "tab-profile" } - even after adding a
# real testID via options.tabBarButtonTestID (app/(app)/_layout.tsx) and
# confirming via `maestro hierarchy` that it genuinely reaches the native
# element (resource-id: "tab-profile", not just accessibilityText). Ran
# the id-based tap 3 times in isolation: Maestro reports each `tapOn`
# COMPLETED, but the screenshot taken right after every single time still
# shows the previous tab selected - the touch itself never lands, not a
# selector-resolution problem. The one structural property "Profile"
# (rightmost) and "Today" (leftmost, in personal_task_smoke.yaml) share,
# that no middle tab does: their bounds sit flush against the screen's own
# edge ([321,791][402,840] of a 402x874 screen, for "Profile"). Coordinate
# tap on those same reported bounds is the most reliable option here, but
# is still not perfectly deterministic even so - retry once, bounded, only
# if the destination hasn't loaded (navigating is not a mutation, so a
# retry here is always safe). See docs/DECISIONS.md, "Phase 5" for the
# full investigation, evidence, and the exact simulator/OS configuration
# this assumes (iPhone 17 Pro, iOS 26.5).
- waitForAnimationToEnd
- tapOn:
    point: '90%, 93%'
- extendedWaitUntil:
    visible:
      id: 'profile-sign-out'
    timeout: 5000
    optional: true
- runFlow:
    when:
      notVisible:
        id: 'profile-sign-out'
    commands:
      - tapOn:
          point: '90%, 93%'
      - extendedWaitUntil:
          visible:
            id: 'profile-sign-out'
          timeout: 10000
- tapOn:
    id: 'profile-sign-out'
- extendedWaitUntil:
    visible: 'Continue'
    timeout: 10000

# --- Sign in as User B ---
- tapOn: 'Continue'
- tapOn:
    id: 'sign-in-email'
- inputText: 'maestro-user-b@familyflow.test'
- tapOn:
    id: 'sign-in-password'
- tapOn: 'Show password'
- extendedWaitUntil:
    visible:
      id: 'sign-in-password'
    timeout: 15000
- repeat:
    while:
      notVisible: '^Maestro1234$'
    commands:
      - tapOn:
          id: 'sign-in-password'
      - eraseText: 50
      - inputText: 'Maestro1234'
      - waitForAnimationToEnd
- tapOn:
    id: 'sign-in-password'
- pressKey: Enter
- extendedWaitUntil:
    visible: 'Not Now'
    timeout: 10000
    optional: true
- tapOn:
    text: 'Not Now'
    optional: true
- extendedWaitUntil:
    visible: 'Today'
    timeout: 10000

# --- User B takes and completes the task ---
- waitForAnimationToEnd
- tapOn:
    id: 'tab-family'
- extendedWaitUntil:
    visible: 'Tasks'
    timeout: 5000
    optional: true
- runFlow:
    when:
      notVisible: 'Tasks'
    commands:
      - tapOn:
          id: 'tab-family'
      - extendedWaitUntil:
          visible: 'Tasks'
          timeout: 10000
- tapOn: 'Tasks'
- extendedWaitUntil:
    visible:
      id: 'family-task-take-.*'
    timeout: 15000
# Take is a real mutation - only retry if the Take button is still there,
# proving the task is still genuinely unassigned (not just that this
# assertion hasn't caught up).
- tapOn:
    id: 'family-task-take-.*'
- extendedWaitUntil:
    notVisible:
      id: 'family-task-take-.*'
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible:
        id: 'family-task-take-.*'
    commands:
      - tapOn:
          id: 'family-task-take-.*'
      - extendedWaitUntil:
          notVisible:
            id: 'family-task-take-.*'
          timeout: 15000

# The structured `checked` selector attribute was confirmed (via `maestro
# hierarchy`) to always report "false" for this component regardless of
# actual state - a custom Pressable's RN accessibilityState.checked
# doesn't surface as XCUITest's own "checked" trait. The real state IS
# reliably exposed as plain text/value ("checkbox, checked" /
# "checkbox, unchecked") - see docs/DECISIONS.md, "Phase 5." Completing is
# a real mutation - only retry if it's still reporting "unchecked".
- tapOn:
    id: 'completion-checkbox-.*'
- extendedWaitUntil:
    visible:
      id: 'completion-checkbox-.*'
      text: 'checkbox, checked'
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible:
        id: 'completion-checkbox-.*'
        text: 'checkbox, unchecked'
    commands:
      - tapOn:
          id: 'completion-checkbox-.*'
      - extendedWaitUntil:
          visible:
            id: 'completion-checkbox-.*'
            text: 'checkbox, checked'
          timeout: 15000

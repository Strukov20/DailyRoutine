name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, wiki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit & component tests
        run: npm run test -- --ci --coverage

      - name: Lint the LLM Wiki
        run: npm run wiki:lint

      - name: Validate Expo config
        run: npx expo config --type public > /dev/null

      - name: expo-doctor
        run: npx expo-doctor

  database:
    name: Database migrations, RLS, and pgTAP tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # GitHub's ubuntu-latest runners ship Docker preinstalled — no secrets
      # or hosted Supabase project are used anywhere in this job, only the
      # local dev stack (see docs/DECISIONS.md, "Docker installed via
      # Homebrew" for why this can't be exercised on every contributor's
      # machine, only in CI, until Docker is available locally too).
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase stack
        run: supabase start

      - name: Reset database (applies migrations + seed.sql)
        run: supabase db reset

      - name: Run pgTAP tests
        run: supabase test db

      # src/lib/supabase/types.ts is currently hand-authored (see that
      # file's header) because this task was built without local Docker
      # access — there is no real generated baseline yet to diff against.
      # Once someone runs `npm run db:types` for real and commits the
      # actual output, add a `supabase gen types ... | diff` drift-check
      # step here. Adding it now would fail CI for a known, expected
      # reason rather than a real bug.

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop
